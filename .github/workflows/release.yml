name: Release

# Workecho 发布流程：打 tag（v*）自动构建 Windows + macOS 安装包并创建 GitHub Release
# macOS 包只能在 macOS Runner 上构建（本仓库在 Windows 上无法交叉构建 mac 目标）。
# 未配置 Apple 签名 secrets 时跳过签名/公证（适合内部分发）；正式对外分发请配置
# CSC_LINK / CSC_KEY_PASSWORD / APPLE_API_KEY* 后去掉 CSC_IDENTITY_AUTO_DISCOVERY=false。

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @workecho/desktop run build
      - name: Package Windows (installer + portable)
        run: pnpm --filter @workecho/desktop exec electron-builder --win nsis portable --publish never --config.npmRebuild=false "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/')
      - name: Package Windows (installer + portable, manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --filter @workecho/desktop exec electron-builder --win nsis portable --publish never --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: workecho-windows
          path: |
            apps/desktop/release/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @workecho/desktop run build
      - name: Package macOS (dmg + zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @workecho/desktop exec electron-builder --mac dmg zip --publish never --config.npmRebuild=false "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/')
      - name: Package macOS (dmg + zip, manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @workecho/desktop exec electron-builder --mac dmg zip --publish never --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: workecho-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
