name: CI

on:
  push:
    branches:
      - main
      - "workecho/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # C-01 防呆：--filter 匹配不到包时 pnpm 静默 exit 0（历史事故：包改名后 CI 全部空转假绿）。
      # 任一 filter 解析不到对应目录即硬失败。
      - name: Assert workspace filters resolve
        run: |
          node -e "
          const { execSync } = require('node:child_process');
          const path = require('node:path');
          const root = process.cwd();
          const expected = ['apps/desktop', 'packages/pi-sdk-driver', 'apps/website'];
          const out = execSync(
            'pnpm --filter @workecho/desktop --filter @pi-gui/pi-sdk-driver --filter @pi-gui/website exec pwd',
            { encoding: 'utf8' },
          );
          const hits = out
            .split(/\r?\n/)
            .filter(Boolean)
            .map((l) => l.trim().split(path.sep).join('/'));
          for (const dir of expected) {
            if (!hits.some((h) => h.endsWith(dir))) {
              console.error('filter did not resolve to ' + dir + '\n' + out);
              process.exit(1);
            }
          }
          console.log('filters ok');
          "

      - name: Typecheck
        run: pnpm typecheck

      - name: Wiki unit tests (Workecho 292-case suite)
        run: pnpm --filter @workecho/desktop run test:unit

      - name: Driver unit tests
        run: pnpm --filter @pi-gui/pi-sdk-driver test

      - name: Changed-file adapter tests
        run: pnpm --filter @workecho/desktop run test:changed-files

      # install-copy 校验的是 pi-gui 上游官网/Homebrew 文案——Workecho 不发布 website，
      # 脚本保留在上游遗产中（scripts/verify-install-copy.mjs），不在本仓库门禁运行
      - name: Verify dev launcher argv/PATH contract
        run: pnpm --dir apps/desktop run verify:launcher-contract

      - name: Test release artifact helpers
        run: pnpm test:release-helpers

      - name: Verify release version consistency
        run: pnpm verify:release-version

      - name: Verify release configuration
        run: pnpm verify:release-config

  website-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @pi-gui/website run build

  desktop-core:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Desktop Core
        run: pnpm --filter @workecho/desktop run test:e2e:ci:mac

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-core-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  desktop-package-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify Linux package configuration
        run: pnpm verify:release-config

      - name: Package Linux AppImage and deb
        run: pnpm --filter @workecho/desktop run package:linux

      - name: Verify packaged runtime dependencies
        run: pnpm --dir apps/desktop run verify:packaged-runtime-deps:linux

      - name: Verify Linux packages
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/apps/desktop/release" \
            "$version" \
            "$PWD/apps/desktop/release-proof/linux"

      - name: Stage validated Linux candidate
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          node apps/desktop/scripts/release-artifacts.mjs stage \
            --platform linux \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --input apps/desktop/release \
            --output apps/desktop/release-candidate

      - name: Upload immutable Linux CI candidate
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-linux-${{ github.sha }}
          path: apps/desktop/release-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Linux package proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-package-proof-${{ github.sha }}
          path: apps/desktop/release-proof/linux/
          if-no-files-found: warn
          retention-days: 14

  desktop-package-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify dev launcher argv/PATH contract
        run: pnpm --dir apps/desktop run verify:launcher-contract

      - name: Changed-file adapter tests
        run: pnpm --filter @workecho/desktop run test:changed-files

      - name: Package Windows directory
        run: pnpm --filter @workecho/desktop run package:win:dir

      - name: Verify packaged runtime dependencies
        run: pnpm --dir apps/desktop run verify:packaged-runtime-deps:windows
